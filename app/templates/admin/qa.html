{% extends "admin/base.html" %}
{% block atitle %}Filing QA{% endblock %}
{% block content %}
<h1>Filing QA checklist</h1>
<div class="tbl"><table><thead><tr><th>Task</th><th>Status</th><th>Owner</th><th>Notes</th><th></th></tr></thead>
<tbody>{% for t in rows %}<tr><form method="post" action="/admin/qa/{{ t.id }}"><input type="hidden" name="csrf" value="{{ csrf }}">
<td>{{ t.task }}</td><td><select name="status">{% for st in statuses %}<option {% if st == t.status %}selected{% endif %}>{{ st }}</option>{% endfor %}</select></td><td><input name="owner" value="{{ t.owner or '' }}" style="width:9em"></td><td><input name="notes" value="{{ t.notes or '' }}"></td><td><button class="btn">Save</button></td></form></tr>{% endfor %}</tbody></table></div>
<h2>Add task</h2>
<form method="post" action="/admin/qa/new" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><input name="task" placeholder="Task" required style="min-width:20em"><input name="owner" placeholder="Owner"><input type="number" name="sort_order" value="500" style="width:5em"><button class="btn primary">Add</button></form>
{% endblock %}
