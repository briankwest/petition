{% extends "admin/base.html" %}
{% block atitle %}Users{% endblock %}
{% block content %}
<h1>Staff users</h1>
<div class="tbl rt"><table><thead><tr><th>Username</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead>
<tbody>{% for u in rows %}<tr><td data-th="">{{ u.username }}</td><td data-th="Role">{{ u.role }}</td><td data-th="Active">{{ 'yes' if u.active else 'no' }}</td><td class="actions inline-actions actions-cell">
<form method="post" action="/admin/users/{{ u.id }}/toggle" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn">{{ 'Deactivate' if u.active else 'Activate' }}</button></form>
<form method="post" action="/admin/users/{{ u.id }}/reset" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="password" name="password" placeholder="New password (10+)" autocomplete="new-password"><button class="btn">Reset</button></form></td></tr>{% endfor %}</tbody></table></div>
<h2>Add user</h2>
<form method="post" action="/admin/users/new" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><input name="username" placeholder="username" required autocomplete="off"><input type="password" name="password" placeholder="password (10+)" required autocomplete="new-password"><select name="role"><option value="editor">editor</option><option value="admin">admin</option></select><button class="btn primary">Add</button></form>
{% endblock %}
