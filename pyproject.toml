[project]
name = "petition-toolkit"
version = "0.1.0"
description = "Pittsburg County referendum toolkit: legal-size petition documents, Petition Master workbook, precinct map, and volunteer site"
requires-python = ">=3.12"
dependencies = [
  "jinja2>=3.1", "pyyaml>=6", "weasyprint>=60", "pypdf>=4", "pdfplumber>=0.11",
  "openpyxl>=3.1", "shapely>=2", "pyproj>=3.6", "requests>=2.31", "textstat>=0.7",
  "matplotlib>=3.8", "markdown>=3.5",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2", "psycopg[binary]>=3.1",
  "python-multipart>=0.0.9", "itsdangerous>=2", "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["toolkit", "toolkit.docs", "toolkit.xlsx", "toolkit.geo", "app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
