<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>{{ doc_title }}</title>
<style>
@page {
  size: 8.5in 14in;
  margin: {{ L.margins_in }}in;
  @bottom-center { content: "{% block footer_text %}{{ doc_title }} · Pittsburg County Referendum{% endblock %} · Page " counter(page) " of " counter(pages); font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 10pt; color: #444; }
  {% if draft %}background: url("{{ wm_portrait }}") no-repeat center / 100% 100%;{% endif %}
}
@page landscape {
  size: 14in 8.5in;
  margin: 0.45in {{ L.margins_in }}in;
  {% if draft %}background: url("{{ wm_landscape }}") no-repeat center / 100% 100%;{% endif %}
}
@page :blank { @top-center { content: "This page intentionally left blank"; font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 10pt; color: #666; } }
* { box-sizing: border-box; }
body { font-family: Georgia, "Liberation Serif", "Times New Roman", "DejaVu Serif", serif; font-size: {{ L.body_pt }}pt; line-height: 1.4; color: #000; font-variant-ligatures: none; margin: 0; }
h1, h2, h3, h4 { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; line-height: 1.2; margin: 0 0 8pt; }
h1 { font-size: 18pt; } h2 { font-size: 15pt; margin-top: 16pt; } h3 { font-size: 13pt; margin-top: 12pt; }
p { margin: 0 0 8pt; }
.sans { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; }
.small { font-size: 10pt; }
.center { text-align: center; }
.muted { color: #444; }
.box { border: 1.5pt solid #000; padding: 8pt 10pt; margin: 8pt 0; }
.rule-box { border: 2.5pt solid #000; padding: 8pt 10pt; margin: 10pt 0; font-weight: bold; }
.blank { display: inline-block; border-bottom: 1pt solid #000; min-width: 2in; height: 14pt; vertical-align: baseline; }
table { border-collapse: collapse; width: 100%; }
table.grid th, table.grid td { border: 1pt solid #000; padding: 5pt 6pt; vertical-align: top; text-align: left; }
table.grid th { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 11pt; background: #eee; }
table.grid tr { break-inside: avoid; }
.pb { break-before: page; }
.no-break { break-inside: avoid; }
.source-notes p.note { font-size: 11pt; margin-bottom: 6pt; }
.source-notes .url { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 10pt; }
.notice { border: 2pt solid #7a0000; padding: 8pt 10pt; margin: 0 0 12pt; font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 11pt; }
{% block css %}{% endblock %}
</style></head>
<body>
{% block content %}{% endblock %}
</body></html>
