name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 poppler-utils fonts-liberation fonts-dejavu-core fontconfig
      - run: python -m venv .venv && .venv/bin/pip install -U pip && .venv/bin/pip install -e ".[dev]"
      - run: make test
      - run: make docs && make check-docs
      - run: make xlsx && make check-xlsx
      - run: make check-geo
